name: Build and publish image to IBM Cloud Container Registry
on:
  release:
    types: [published]
  pull_request_target:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
      - name: SonarCloud Scan
        if: github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        if: github.event_name == 'release'
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        if: github.event_name == 'release'
        uses: docker/setup-buildx-action@v1
      - name: Login to IBM Cloud Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v1 
        with:
          registry: icr.io
          username: ${{ secrets.ICR_USERNAME }}
          password: ${{ secrets.ICR_TOKEN }}
      - name: Build and push
        id: docker_build
        if: github.event_name == 'release'
        uses: docker/build-push-action@v2
        with:
          build-args: |
            version=${{ github.event.release.tag_name }}
          push: true
          tags: icr.io/instana/pipeline-feedback-resource
      - name: Image digest
        if: github.event_name == 'release'
        run: echo ${{ steps.docker_build.outputs.digest }}